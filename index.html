<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Game Dưa Hấu Idol</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body {
            width: 100%; height: 100%;
            background: #f7f4ec;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 { color: #555; font-size: 22px; margin-bottom: 5px; }
        .score-box { font-size: 16px; color: #777; margin-bottom: 10px; font-weight: bold; }
        canvas {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            touch-action: none;
        }
    </style>
</head>
<body>

    <h1>🍉 Game Dưa Hấu Idol 🍉</h1>
    <div class="score-box">Điểm: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");

        const WIDTH = 360;
        const HEIGHT = 520;
        canvas.width = WIDTH;
        canvas.height = HEIGHT;

        let score = 0;
        let gameOver = false;

        const FRUITS = [
            { radius: 18, imgFiles: ["2.jpg", "2.JPG"] },
            { radius: 25, imgFiles: ["4.jpg", "4.JPG"] },
            { radius: 33, imgFiles: ["8.jpg", "8.JPG"] },
            { radius: 42, imgFiles: ["16.jpg", "16.JPG"] },
            { radius: 52, imgFiles: ["32.jpg", "32.JPG"] },
            { radius: 64, imgFiles: ["64.jpg", "64.JPG"] },
            { radius: 78, imgFiles: ["128.jpg", "128.JPG"] },
            { radius: 95, imgFiles: ["256.jpg", "256.JPG"] }
        ];

        let loadedImages = [];
        FRUITS.forEach((fruit, index) => {
            let img = new Image();
            let srcIndex = 0;
            img.src = fruit.imgFiles[0];
            img.onerror = function() {
                srcIndex++;
                if (srcIndex < fruit.imgFiles.length) {
                    this.src = fruit.imgFiles[srcIndex];
                }
            };
            loadedImages[index] = img;
        });

        let circles = [];
        let currentFruit = null;
        let dropCooldown = false;

        function spawnFruit() {
            if (gameOver) return;
            let level = Math.floor(Math.random() * 3);
            currentFruit = {
                x: WIDTH / 2,
                y: 40,
                radius: FRUITS[level].radius,
                level: level,
                isDropped: false
            };
        }

        // Theo dõi ngón tay/chuột di chuyển mượt mà trên toàn màn hình canvas
        function handleMove(clientX) {
            if (!currentFruit || currentFruit.isDropped || dropCooldown) return;
            let rect = canvas.getBoundingClientRect();
            let scaleX = WIDTH / rect.width;
            let x = (clientX - rect.left) * scaleX;
            let r = currentFruit.radius;
            if (x < r) x = r;
            if (x > WIDTH - r) x = WIDTH - r;
            currentFruit.x = x;
        }

        canvas.addEventListener("pointermove", (e) => {
            handleMove(e.clientX);
        });

        // Thả quả ngay tại vị trí chạm tay/click chuột
        canvas.addEventListener("pointerdown", (e) => {
            handleMove(e.clientX);
            if (!currentFruit || currentFruit.isDropped || dropCooldown) return;
            currentFruit.isDropped = true;
            circles.push(currentFruit);
            currentFruit = null;
            dropCooldown = true;
            setTimeout(() => {
                dropCooldown = false;
                spawnFruit();
            }, 400);
        });

        function update() {
            if (gameOver) return;

            for (let i = 0; i < circles.length; i++) {
                let c = circles[i];
                if (c.isDropped) {
                    c.y += 4;
                    if (c.y + c.radius > HEIGHT) {
                        c.y = HEIGHT - c.radius;
                    }
                }
            }

            for (let i = 0; i < circles.length; i++) {
                for (let j = i + 1; j < circles.length; j++) {
                    let c1 = circles[i];
                    let c2 = circles[j];
                    let dist = Math.hypot(c1.x - c2.x, c1.y - c2.y);
                    if (dist < c1.radius + c2.radius && c1.level === c2.level) {
                        let newLevel = c1.level + 1;
                        if (newLevel < FRUITS.length) {
                            c1.radius = FRUITS[newLevel].radius;
                            c1.level = newLevel;
                            score += (newLevel * 10);
                            scoreEl.innerText = score;
                            circles.splice(j, 1);
                            break;
                        }
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, WIDTH, HEIGHT);

            ctx.strokeStyle = "#ff4d4d";
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(0, 70);
            ctx.lineTo(WIDTH, 70);
            ctx.stroke();
            ctx.setLineDash([]);

            for (let c of circles) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
                ctx.clip();
                
                let img = loadedImages[c.level];
                if (img && img.complete && img.naturalWidth !== 0) {
                    ctx.drawImage(img, c.x - c.radius, c.y - c.radius, c.radius * 2, c.radius * 2);
                } else {
                    ctx.fillStyle = "#ddd";
                    ctx.fill();
                }
                ctx.restore();

                ctx.beginPath();
                ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            if (currentFruit && !currentFruit.isDropped) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(currentFruit.x, currentFruit.y, currentFruit.radius, 0, Math.PI * 2);
                ctx.clip();

                let img = loadedImages[currentFruit.level];
                if (img && img.complete && img.naturalWidth !== 0) {
                    ctx.drawImage(img, currentFruit.x - currentFruit.radius, currentFruit.y - currentFruit.radius, currentFruit.radius * 2, currentFruit.radius * 2);
                } else {
                    ctx.fillStyle = "#ddd";
                    ctx.fill();
                }
                ctx.restore();

                ctx.beginPath();
                ctx.arc(currentFruit.x, currentFruit.y, currentFruit.radius, 0, Math.PI * 2);
                ctx.strokeStyle = "#333";
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        spawnFruit();
        loop();
    </script>
</body>
</html>
