<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 Idol Edition</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #faf8ef;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: none;
            overscroll-behavior: none;
        }
        .container {
            width: 100%;
            max-width: 500px;
            height: 100%;
            margin: 0 auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }
        .header {
            text-align: center;
            width: 100%;
            margin-top: 10px;
        }
        h1 {
            color: #776e65;
            margin: 0 0 10px 0;
            font-size: 28px;
        }
        .score-container {
            background: #bbada0;
            color: white;
            padding: 8px 25px;
            border-radius: 8px;
            display: inline-block;
            font-weight: bold;
            font-size: 18px;
        }
        .grid-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }
        .grid {
            width: 92vw;
            height: 92vw;
            max-width: 420px;
            max-height: 420px;
            background: #bbada0;
            border-radius: 10px;
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 12px;
            touch-action: none;
        }
        .cell {
            background: rgba(238, 228, 218, 0.35);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #776e65;
            position: relative;
            overflow: hidden;
        }
        .cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
            display: block;
        }
        .footer {
            margin-bottom: 15px;
            text-align: center;
            color: #776e65;
            font-size: 13px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
