<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Game Dưa Hấu Idol</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body {
            width: 100%; height: 100%;
            background: #f7f4ec;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 { color: #555; font-size: 22px; margin-bottom: 5px; }
        .score-box { font-size: 16px; color: #777; margin-bottom: 10px; font-weight: bold; }
        canvas {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            touch-action: none;
        }
    </style>
</head>
<body>

    <h1>🍉 Game Dưa Hấu Idol 🍉</h1>
    <div class="score-box">Điểm: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");

        // Thiết lập kích thước khung game phù hợp màn hình điện thoại
        const WIDTH = 360;
        const HEIGHT = 520;
        canvas.width = WIDTH;
        canvas.height = HEIGHT;

        let score = 0;
        let gameOver = false;

        // Định nghĩa các cấp độ trái cây / idol (Bán kính và tên)
        const FRUITS = [
            { radius: 15, color: "#ff4d4d", name: "Level 1" },
            { radius: 22, color: "#ffa500", name: "Level 2" },
            { radius: 30, color: "#ffd700", name: "Level 3" },
            { radius: 40, color: "#9acd32", name: "Level 4" },
            { radius: 50, color: "#20b2aa", name: "Level 5" },
            { radius: 62, color: "#1e90ff", name: "Level 6" },
            { radius: 75, color: "#9370db", name: "Level 7" },
            { radius: 90, color: "#ff1493", name: "Level 8" }
        ];

        let circles = [];
        let currentFruit = null;
        let dropCooldown = false;

        function spawnFruit() {
            if (gameOver) return;
            let level = Math.floor(Math.random() * 3); // Ra các quả nhỏ từ 0 đến 2
            currentFruit = {
                x: WIDTH / 2,
                y: 50,
                radius: FRUITS[level].radius,
                level: level,
                color: FRUITS[level].color,
                isDropped: false
            };
        }

        // Điều khiển thả quả khi chạm màn hình điện thoại hoặc click chuột
        canvas.addEventListener("pointermove", (e) => {
            if (!currentFruit || currentFruit.isDropped || dropCooldown) return;
            let rect = canvas.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let r = currentFruit.radius;
            if (x < r) x = r;
            if (x > WIDTH - r) x = WIDTH - r;
            currentFruit.x = x;
        });

        canvas.addEventListener("pointerdown", (e) => {
            if (!currentFruit || currentFruit.isDropped || dropCooldown) return;
            currentFruit.isDropped = true;
            circles.push(currentFruit);
            currentFruit = null;
            dropCooldown = true;
            setTimeout(() => {
                dropCooldown = false;
                spawnFruit();
            }, 500);
        });

        function update() {
            if (gameOver) return;

            // Di chuyển các quả rơi xuống và va chạm đơn giản
            for (let i = 0; i < circles.length; i++) {
                let c = circles[i];
                if (c.isDropped) {
                    c.y += 4; // Tốc độ rơi
                    // Chạm đáy
                    if (c.y + c.radius > HEIGHT) {
                        c.y = HEIGHT - c.radius;
                    }
                }
            }

            // Kiểm tra va chạm nhập 2 quả cùng cấp
            for (let i = 0; i < circles.length; i++) {
                for (let j = i + 1; j < circles.length; j++) {
                    let c1 = circles[i];
                    let c2 = circles[j];
                    let dist = Math.hypot(c1.x - c2.x, c1.y - c2.y);
                    if (dist < c1.radius + c2.radius && c1.level === c2.level) {
                        let newLevel = c1.level + 1;
                        if (newLevel < FRUITS.length) {
                            c1.radius = FRUITS[newLevel].radius;
                            c1.level = newLevel;
                            c1.color = FRUITS[newLevel].color;
                            score += (newLevel * 10);
                            scoreEl.innerText = score;
                            circles.splice(j, 1);
                            break;
                        }
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, WIDTH, HEIGHT);

            // Vẽ vạch giới hạn phía trên
            ctx.strokeStyle = "#ff4d4d";
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(0, 80);
            ctx.lineTo(WIDTH, 80);
            ctx.stroke();
            ctx.setLineDash([]);

            // Vẽ các quả đã thả
            for (let c of circles) {
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
                ctx.fillStyle = c.color;
                ctx.fill();
                ctx.strokeStyle = "#333";
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.closePath();
            }

            // Vẽ quả đang chuẩn bị thả ở trên cùng
            if (currentFruit && !currentFruit.isDropped) {
                ctx.beginPath();
                ctx.arc(currentFruit.x, currentFruit.y, currentFruit.radius, 0, Math.PI * 2);
                ctx.fillStyle = currentFruit.color;
                ctx.fill();
                ctx.strokeStyle = "#333";
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.closePath();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        spawnFruit();
        loop();
    </script>
</body>
</html>
